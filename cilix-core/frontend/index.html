<!DOCTYPE html>
<!-- Cilix v1.2 - UI basada en pr1 (Sylix OS Core) -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cilix Assistant v1.2</title>
  <meta name="description" content="Agente autónomo VTuber Live2D — Cilix v1.2: sistema local 100% offline." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan:       #00f5ff;
      --cyan-dark:  #00b8cc;
      --magenta:    #ff2d78;
      --purple:     #8b5cf6;
      --bg:         #050a14;
      --surface:    rgba(10, 20, 40, 0.82);
      --border:     rgba(0, 245, 255, 0.18);
      --border-hot: rgba(0, 245, 255, 0.55);
      --text:       #e2f0ff;
      --text-dim:   rgba(226, 240, 255, 0.45);
      --success:    #22d3a0;
      --warning:    #f59e0b;
      --error:      #ff4d6d;
      --font-ui:    'Outfit', system-ui, sans-serif;
      --font-mono:  'JetBrains Mono', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-ui);
      color: var(--text);
    }

    /* Fondo animado */
    #bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(to bottom, #050a14 0%, #090d1f 100%);
    }

    /* HUD principal */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 12px;
      padding: 16px;
    }

    /* Header */
    #hud-header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hud-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .hud-logo-text h1 {
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    .status-dot[data-state="thinking"] { background: var(--cyan); }
    .status-dot[data-state="executing"] { background: var(--warning); }
    .status-dot[data-state="talking"] { background: var(--magenta); }
    .status-dot[data-state="error"] { background: var(--error); }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.8); }
    }

    /* Panel izquierdo */
    #panel-left {
      grid-row: 2;
      grid-column: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Panel derecho - Chat */
    #panel-right {
      grid-row: 2;
      grid-column: 2;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Cards */
    .hud-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      backdrop-filter: blur(20px);
      transition: border-color 0.3s ease;
    }
    .hud-card:hover { border-color: var(--border-hot); }

    .card-title {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cyan);
      font-family: var(--font-mono);
      margin-bottom: 10px;
    }

    /* Chat history */
    #chat-history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.78rem;
      line-height: 1.5;
      max-width: 95%;
    }
    .chat-bubble.user {
      background: rgba(79, 70, 229, 0.18);
      border: 1px solid rgba(79,70,229,0.35);
      align-self: flex-end;
    }
    .chat-bubble.assistant {
      background: rgba(0, 245, 255, 0.07);
      border: 1px solid rgba(0,245,255,0.2);
      align-self: flex-start;
      color: var(--cyan);
    }

    /* Footer input */
    #hud-footer {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 18px;
      gap: 10px;
    }
    #input-wrapper:focus-within {
      border-color: var(--cyan);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.88rem;
    }

    #mic-btn, #send-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
    }
    #mic-btn {
      background: var(--surface);
      border: 1px solid var(--border);
    }
    #mic-btn:hover { border-color: var(--magenta); }
    #mic-btn.recording { background: rgba(255,45,120,0.15); border-color: var(--magenta); }
    #send-btn {
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: var(--bg);
    }
    #send-btn:hover { transform: scale(1.1); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,245,255,0.2); border-radius: 4px; }

    /* Resizable */
    #panel-right { min-width: 300px; resize: horizontal; overflow: auto; }

    /* Responsive */
    @media (max-width: 900px) {
      #hud { grid-template-columns: 1fr; }
      #panel-left { display: none; }
    }
  </style>
</head>
<body>

<!-- Fondo -->
<div id="bg-grid"></div>

<!-- HUD -->
<div id="hud">
  <!-- Header -->
  <header id="hud-header">
    <div class="hud-logo">
      <div class="hud-logo-icon">⬡</div>
      <div class="hud-logo-text">
        <h1>CILIX v1.2</h1>
      </div>
    </div>
    <div class="hud-status-bar">
      <div class="status-dot" id="status-dot" data-state="idle"></div>
      <span id="status-label" style="font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700;">IDLE</span>
    </div>
  </header>

  <!-- Panel Izquierdo -->
  <aside id="panel-left">
    <div class="hud-card">
      <div class="card-title">Backend</div>
      <div id="backend-label" style="font-family: var(--font-mono); color: var(--cyan);">Ollama (local)</div>
    </div>
    
    <div class="hud-card">
      <div class="card-title">RAM</div>
      <div id="mem-label" style="font-family: var(--font-mono);">--%</div>
    </div>

    <div class="hud-card">
      <div class="card-title">Estado</div>
      <div id="state-badge" style="display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px; font-size:0.65rem; font-weight:700; font-family:var(--font-mono); background:rgba(34,211,160,0.08); border:1px solid rgba(34,211,160,0.4); color:var(--success);">● IDLE</div>
    </div>
  </aside>

  <!-- Panel Derecho - Chat -->
  <aside id="panel-right" style="min-width: 350px;">
    <div class="hud-card" style="flex:1; display:flex; flex-direction:column;">
      <div class="card-title">Conversación</div>
      <div id="chat-history">
        <div class="chat-bubble assistant">
          <div style="font-size:0.6rem; font-family:var(--font-mono); color:var(--cyan); margin-bottom:3px;">Cilix</div>
          Sistema activo. ¿Qué necesitas?
        </div>
      </div>
    </div>
  </aside>

  <!-- Footer input -->
  <footer id="hud-footer">
    <button id="mic-btn" onclick="toggleMic()" title="Micrófono">🎙️</button>
    <div id="input-wrapper">
      <input type="text" id="user-input" placeholder="Escribe tu mensaje..." autocomplete="off" />
      <button id="send-btn" onclick="sendMessage()" title="Enviar">➤</button>
    </div>
  </footer>
</div>

<!-- Scripts -->
<script src="renderer.js"></script>
<script>
  console.log('Cilix v1.2 - UI basada en pr1 cargada');
</script>
</body>
</html>
